<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Productos CRUD</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="contenedor">
        <header>
            <h1><i class="fas fa-box-open"></i> Gestor de Productos</h1>
            <p>Sistema CRUD con JSON y LocalStorage</p>
        </header>

        <!-- Formulario para Crear/Editar -->
        <section class="formulario-section">
            <h2 id="tituloFormulario">Nuevo Producto</h2>
            <form id="formProducto">
                <input type="hidden" id="productoId">
                
                <div class="campo">
                    <label for="nombre">Nombre del Producto:</label>
                    <input type="text" id="nombre" required placeholder="Ej: Laptop HP">
                </div>

                <div class="campo">
                    <label for="precio">Precio ($):</label>
                    <input type="number" id="precio" required placeholder="Ej: 999.99" step="0.01">
                </div>

                <div class="campo">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" required>
                        <option value="">Seleccione...</option>
                        <option value="Electrónica">Electrónica</option>
                        <option value="Ropa">Ropa</option>
                        <option value="Hogar">Hogar</option>
                        <option value="Deportes">Deportes</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" required placeholder="Ej: 50" min="0">
                </div>

                <div class="botones-form">
                    <button type="submit" id="btnGuardar">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                    <button type="button" id="btnCancelar" class="btn-secundario">
                        <i class="fas fa-times"></i> Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Barra de Búsqueda y Acciones -->
        <section class="acciones-section">
            <div class="buscador">
                <input type="text" id="buscador" placeholder="🔍 Buscar producto...">
            </div>
            <div class="botones-accion">
                <button id="btnExportar" class="btn-info">
                    <i class="fas fa-download"></i> Exportar JSON
                </button>
                <button id="btnImportar" class="btn-info">
                    <i class="fas fa-upload"></i> Importar JSON
                </button>
                <input type="file" id="inputArchivo" accept=".json" style="display: none;">
            </div>
        </section>

        <!-- Tabla de Productos -->
        <section class="tabla-section">
            <div class="info-tabla">
                <span id="contadorProductos">0 productos</span>
                <span id="valorTotal">Total: $0.00</span>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Precio</th>
                        <th>Categoría</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaProductos">
                    <!-- Los productos se insertarán aquí con JS -->
                </tbody>
            </table>

            <div id="mensajeVacio" class="mensaje-vacio">
                <i class="fas fa-inbox"></i>
                <p>No hay productos registrados</p>
            </div>
        </section>
    </div>

    <!-- Modal para confirmar eliminación -->
    <div id="modalConfirmacion" class="modal">
        <div class="modal-contenido">
            <h3>¿Estás seguro?</h3>
            <p>Esta acción no se puede deshacer</p>
            <div class="modal-botones">
                <button id="btnConfirmarEliminar" class="btn-peligro">Sí, Eliminar</button>
                <button id="btnCancelarEliminar" class="btn-secundario">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
