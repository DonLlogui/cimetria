<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <h1 id="titulo">Hola Mundo</h1>
    <button id="miBoton">Haz clic aquí</button>
    <button id="BotonA">Pintar Amarillo</button>
    
   
    <form action="">
        <input type="number" name="t1" id="t1" placeholder="digite un numero entero">
        <input type="number" name="t2" id="t2" placeholder="digite otro numero entero">
        <button type="button" id="BotonS">Sumar</button>
        <button type="button" id="BotonR">Restar</button>
        <button type="button" id="BotonM">Multiplicar</button>
        <button type="button" id="BotonD">Dividir</button>
        
        <input type="text" id="respuesta" placeholder="respuesta" readonly>
    </form>
    
    <script src="js/main.js"></script>
</body>
</html>
